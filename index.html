<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Tracker App</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?display=swap&family=Manrope:wght@400;500;700;800&family=Noto+Sans:wght@400;500;700;900" />
    <style>
        @keyframes fade-in {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in {
            animation: fade-in 0.3s ease-out;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function SalesTrackerApp() {
            const [currentPage, setCurrentPage] = useState('dashboard');
            const [target, setTarget] = useState(10000);
            const [currentSales, setCurrentSales] = useState(6500);
            const [salesRevenue, setSalesRevenue] = useState('');
            const [unitsSold, setUnitsSold] = useState('');
            const [targetInput, setTargetInput] = useState('');
            const [showSuccess, setShowSuccess] = useState(false);

            const progress = target > 0 ? Math.min(Math.round((currentSales / target) * 100), 100) : 0;

            const achievements = [
                { label: '50% Achieved', threshold: 50, achieved: progress >= 50 },
                { label: '70% Achieved', threshold: 70, achieved: progress >= 70 },
                { label: '100% Achieved', threshold: 100, achieved: progress >= 100 }
            ];

            const handleSaveSales = () => {
                const revenue = parseFloat(salesRevenue);
                if (!isNaN(revenue) && revenue > 0) {
                    setCurrentSales(prev => prev + revenue);
                    setSalesRevenue('');
                    setUnitsSold('');
                    setShowSuccess(true);
                    setTimeout(() => {
                        setCurrentPage('dashboard');
                        setTimeout(() => setShowSuccess(false), 500);
                    }, 1000);
                } else {
                    alert('Please enter a valid sales revenue amount');
                }
            };

            const handleSaveTarget = () => {
                const newTarget = parseFloat(targetInput);
                if (!isNaN(newTarget) && newTarget > 0) {
                    setTarget(newTarget);
                    setTargetInput('');
                    setShowSuccess(true);
                    setTimeout(() => {
                        setCurrentPage('dashboard');
                        setTimeout(() => setShowSuccess(false), 500);
                    }, 1000);
                } else {
                    alert('Please enter a valid target amount');
                }
            };

            const SuccessMessage = () => (
                <div className="fixed inset-0 flex items-center justify-center z-50 pointer-events-none">
                    <div className="bg-green-500 text-white px-8 py-4 rounded-lg shadow-2xl animate-bounce">
                        <div className="flex items-center gap-3">
                            <svg className="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                                <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd" />
                            </svg>
                            <span className="font-bold text-lg">Saved Successfully!</span>
                        </div>
                    </div>
                </div>
            );

            if (currentPage === 'dashboard') {
                return (
                    <div className="relative flex h-auto min-h-screen w-full flex-col bg-slate-50 justify-between animate-fade-in" style={{ fontFamily: 'Manrope, "Noto Sans", sans-serif' }}>
                        <div>
                            <div className="flex items-center bg-slate-50 p-4 pb-2 justify-between">
                                <h2 className="text-[#0d141b] text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pl-12">Dashboard</h2>
                                <div className="flex w-12 items-center justify-end">
                                    <button onClick={() => setCurrentPage('about')} className="flex max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 bg-transparent text-[#0d141b] gap-2 text-base font-bold leading-normal tracking-[0.015em] min-w-0 p-0">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
                                            <path d="M128,80a48,48,0,1,0,48,48A48.05,48.05,0,0,0,128,80Zm0,80a32,32,0,1,1,32-32A32,32,0,0,1,128,160Zm88-29.84q.06-2.16,0-4.32l14.92-18.64a8,8,0,0,0,1.48-7.06,107.21,107.21,0,0,0-10.88-26.25,8,8,0,0,0-6-3.93l-23.72-2.64q-1.48-1.56-3-3L186,40.54a8,8,0,0,0-3.94-6,107.71,107.71,0,0,0-26.25-10.87,8,8,0,0,0-7.06,1.49L130.16,40Q128,40,125.84,40L107.2,25.11a8,8,0,0,0-7.06-1.48A107.6,107.6,0,0,0,73.89,34.51a8,8,0,0,0-3.93,6L67.32,64.27q-1.56,1.49-3,3L40.54,70a8,8,0,0,0-6,3.94,107.71,107.71,0,0,0-10.87,26.25,8,8,0,0,0,1.49,7.06L40,125.84Q40,128,40,130.16L25.11,148.8a8,8,0,0,0-1.48,7.06,107.21,107.21,0,0,0,10.88,26.25,8,8,0,0,0,6,3.93l23.72,2.64q1.49,1.56,3,3L70,215.46a8,8,0,0,0,3.94,6,107.71,107.71,0,0,0,26.25,10.87,8,8,0,0,0,7.06-1.49L125.84,216q2.16.06,4.32,0l18.64,14.92a8,8,0,0,0,7.06,1.48,107.21,107.21,0,0,0,26.25-10.88,8,8,0,0,0,3.93-6l2.64-23.72q1.56-1.48,3-3L215.46,186a8,8,0,0,0,6-3.94,107.71,107.71,0,0,0,10.87-26.25,8,8,0,0,0-1.49-7.06Zm-16.1-6.5a73.93,73.93,0,0,1,0,8.68,8,8,0,0,0,1.74,5.48l14.19,17.73a91.57,91.57,0,0,1-6.23,15L187,173.11a8,8,0,0,0-5.1,2.64,74.11,74.11,0,0,1-6.14,6.14,8,8,0,0,0-2.64,5.1l-2.51,22.58a91.32,91.32,0,0,1-15,6.23l-17.74-14.19a8,8,0,0,0-5-1.75h-.48a73.93,73.93,0,0,1-8.68,0,8,8,0,0,0-5.48,1.74L100.45,215.8a91.57,91.57,0,0,1-15-6.23L82.89,187a8,8,0,0,0-2.64-5.1,74.11,74.11,0,0,1-6.14-6.14,8,8,0,0,0-5.1-2.64L46.43,170.6a91.32,91.32,0,0,1-6.23-15l14.19-17.74a8,8,0,0,0,1.74-5.48,73.93,73.93,0,0,1,0-8.68,8,8,0,0,0-1.74-5.48L40.2,100.45a91.57,91.57,0,0,1,6.23-15L69,82.89a8,8,0,0,0,5.1-2.64,74.11,74.11,0,0,1,6.14-6.14A8,8,0,0,0,82.89,69L85.4,46.43a91.32,91.32,0,0,1,15-6.23l17.74,14.19a8,8,0,0,0,5.48,1.74,73.93,73.93,0,0,1,8.68,0,8,8,0,0,0,5.48-1.74L155.55,40.2a91.57,91.57,0,0,1,15,6.23L173.11,69a8,8,0,0,0,2.64,5.1,74.11,74.11,0,0,1,6.14,6.14,8,8,0,0,0,5.1,2.64l22.58,2.51a91.32,91.32,0,0,1,6.23,15l-14.19,17.74A8,8,0,0,0,199.87,123.66Z"></path>
                                        </svg>
                                    </button>
                                </div>
                            </div>

                            <h2 className="text-[#0d141b] text-[22px] font-bold leading-tight tracking-[-0.015em] px-4 pb-3 pt-5">Monthly Target</h2>
                            <div className="flex flex-wrap gap-4 p-4">
                                <div className="flex min-w-[158px] flex-1 flex-col gap-2 rounded-lg p-6 bg-[#e7edf3] transform hover:scale-105 transition-transform duration-200">
                                    <p className="text-[#0d141b] text-base font-medium leading-normal">Target</p>
                                    <p className="text-[#0d141b] tracking-light text-2xl font-bold leading-tight">LKR {target.toLocaleString()}</p>
                                </div>
                            </div>

                            <h2 className="text-[#0d141b] text-[22px] font-bold leading-tight tracking-[-0.015em] px-4 pb-3 pt-5">Sales Progress</h2>
                            <div className="flex flex-wrap gap-4 p-4">
                                <div className="flex min-w-[158px] flex-1 flex-col gap-2 rounded-lg p-6 bg-[#e7edf3] transform hover:scale-105 transition-transform duration-200">
                                    <p className="text-[#0d141b] text-base font-medium leading-normal">Current Sales</p>
                                    <p className="text-[#0d141b] tracking-light text-2xl font-bold leading-tight">LKR {currentSales.toLocaleString()}</p>
                                </div>
                            </div>

                            <div className="flex flex-col gap-3 p-4">
                                <div className="flex gap-6 justify-between">
                                    <p className="text-[#0d141b] text-base font-medium leading-normal">Progress</p>
                                    <p className="text-[#0d141b] text-sm font-normal leading-normal">{progress}%</p>
                                </div>
                                <div className="rounded bg-[#cfdbe7]">
                                    <div className="h-2 rounded bg-[#1172d4] transition-all duration-500" style={{ width: `${progress}%` }}></div>
                                </div>
                            </div>

                            <h2 className="text-[#0d141b] text-[22px] font-bold leading-tight tracking-[-0.015em] px-4 pb-3 pt-5">Achievement Goals</h2>
                            {achievements.map((achievement, idx) => (
                                <div key={idx} className="flex items-center gap-4 bg-slate-50 px-4 min-h-14 justify-between hover:bg-[#e7edf3] transition-colors duration-200">
                                    <p className="text-[#0d141b] text-base font-normal leading-normal flex-1 truncate">{achievement.label}</p>
                                    <div className="shrink-0">
                                        <div className={`flex size-7 items-center justify-center transition-all duration-500 ${achievement.achieved ? 'text-green-600 scale-110' : 'text-gray-300'}`}>
                                            <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
                                                <path d="M229.66,77.66l-128,128a8,8,0,0,1-11.32,0l-56-56a8,8,0,0,1,11.32-11.32L96,188.69,218.34,66.34a8,8,0,0,1,11.32,11.32Z"></path>
                                            </svg>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>

                        <div>
                            <div className="flex gap-2 border-t border-[#e7edf3] bg-slate-50 px-4 pb-3 pt-2">
                                <button onClick={() => setCurrentPage('dashboard')} className="flex flex-1 flex-col items-center justify-end gap-1 rounded-full text-[#0d141b] transform hover:scale-110 transition-transform duration-200">
                                    <div className="text-[#0d141b] flex h-8 items-center justify-center">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
                                            <path d="M224,115.55V208a16,16,0,0,1-16,16H168a16,16,0,0,1-16-16V168a8,8,0,0,0-8-8H112a8,8,0,0,0-8,8v40a16,16,0,0,1-16,16H48a16,16,0,0,1-16-16V115.55a16,16,0,0,1,5.17-11.78l80-75.48.11-.11a16,16,0,0,1,21.53,0,1.14,1.14,0,0,0,.11.11l80,75.48A16,16,0,0,1,224,115.55Z"></path>
                                        </svg>
                                    </div>
                                    <p className="text-[#0d141b] text-xs font-medium leading-normal tracking-[0.015em]">Dashboard</p>
                                </button>
                                <button onClick={() => setCurrentPage('addSales')} className="flex flex-1 flex-col items-center justify-end gap-1 text-[#4c739a] transform hover:scale-110 transition-transform duration-200">
                                    <div className="text-[#4c739a] flex h-8 items-center justify-center">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
                                            <path d="M224,128a8,8,0,0,1-8,8H136v80a8,8,0,0,1-16,0V136H40a8,8,0,0,1,0-16h80V40a8,8,0,0,1,16,0v80h80A8,8,0,0,1,224,128Z"></path>
                                        </svg>
                                    </div>
                                    <p className="text-[#4c739a] text-xs font-medium leading-normal tracking-[0.015em]">Add Sales</p>
                                </button>
                                <button onClick={() => setCurrentPage('setTarget')} className="flex flex-1 flex-col items-center justify-end gap-1 text-[#4c739a] transform hover:scale-110 transition-transform duration-200">
                                    <div className="text-[#4c739a] flex h-8 items-center justify-center">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
                                            <path d="M221.87,83.16A104.1,104.1,0,1,1,195.67,49l22.67-22.68a8,8,0,0,1,11.32,11.32l-96,96a8,8,0,0,1-11.32-11.32l27.72-27.72a40,40,0,1,0,17.87,31.09,8,8,0,1,1,16-.9,56,56,0,1,1-22.38-41.65L184.3,60.39a87.88,87.88,0,1,0,23.13,29.67,8,8,0,0,1,14.44-6.9Z"></path>
                                        </svg>
                                    </div>
                                    <p className="text-[#4c739a] text-xs font-medium leading-normal tracking-[0.015em]">Set Target</p>
                                </button>
                            </div>
                            <div className="h-5 bg-slate-50"></div>
                        </div>
                    </div>
                );
            }

            if (currentPage === 'addSales') {
                return (
                    <div className="relative flex h-screen w-full flex-col bg-slate-50 justify-between overflow-hidden" style={{ fontFamily: 'Manrope, "Noto Sans", sans-serif' }}>
                        {showSuccess && <SuccessMessage />}
                        <div className="flex-1 overflow-y-auto">
                            <div className="flex items-center bg-slate-50 p-4 pb-2 justify-between">
                                <button onClick={() => setCurrentPage('dashboard')} className="text-[#0d141b] flex size-12 shrink-0 items-center cursor-pointer">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
                                        <path d="M205.66,194.34a8,8,0,0,1-11.32,11.32L128,139.31,61.66,205.66a8,8,0,0,1-11.32-11.32L116.69,128,50.34,61.66A8,8,0,0,1,61.66,50.34L128,116.69l66.34-66.35a8,8,0,0,1,11.32,11.32L139.31,128Z"></path>
                                    </svg>
                                </button>
                                <h2 className="text-[#0d141b] text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Add Sales</h2>
                            </div>
                            <div className="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
                                <label className="flex flex-col min-w-40 flex-1">
                                    <input type="number" placeholder="Sales Revenue (LKR)" value={salesRevenue} onChange={(e) => setSalesRevenue(e.target.value)} className="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#0d141b] focus:outline-0 focus:ring-0 border-none bg-[#e7edf3] focus:border-none h-14 placeholder:text-[#4c739a] p-4 text-base font-normal leading-normal" />
                                </label>
                            </div>
                            <div className="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
                                <label className="flex flex-col min-w-40 flex-1">
                                    <input type="number" placeholder="Units Sold" value={unitsSold} onChange={(e) => setUnitsSold(e.target.value)} className="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#0d141b] focus:outline-0 focus:ring-0 border-none bg-[#e7edf3] focus:border-none h-14 placeholder:text-[#4c739a] p-4 text-base font-normal leading-normal" />
                                </label>
                            </div>
                        </div>
                        <div className="flex-shrink-0 bg-slate-50 pb-safe">
                            <div className="flex px-4 py-3">
                                <button onClick={handleSaveSales} className="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 flex-1 bg-[#1172d4] text-slate-50 text-base font-bold leading-normal tracking-[0.015em] transform hover:scale-105 hover:bg-[#0d5cb5] active:scale-95 transition-all duration-200">
                                    <span className="truncate">Save</span>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (currentPage === 'setTarget') {
                return (
                    <div className="relative flex h-screen w-full flex-col bg-slate-50 justify-between overflow-hidden animate-fade-in" style={{ fontFamily: 'Manrope, "Noto Sans", sans-serif' }}>
                        {showSuccess && <SuccessMessage />}
                        <div className="flex-1 overflow-y-auto">
                            <div className="flex items-center bg-slate-50 p-4 pb-2 justify-between">
                                <button onClick={() => setCurrentPage('dashboard')} className="text-[#0d141b] flex size-12 shrink-0 items-center cursor-pointer">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
                                        <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
                                    </svg>
                                </button>
                                <h2 className="text-[#0d141b] text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Set Target</h2>
                            </div>
                            <div className="flex max-w-[480px] flex-wrap items-end gap-4 px-4 py-3">
                                <label className="flex flex-col min-w-40 flex-1">
                                    <input type="number" placeholder="Enter your monthly sales target (LKR)" value={targetInput} onChange={(e) => setTargetInput(e.target.value)} className="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#0d141b] focus:outline-0 focus:ring-0 border-none bg-[#e7edf3] focus:border-none h-14 placeholder:text-[#4c739a] p-4 text-base font-normal leading-normal" />
                                </label>
                            </div>
                        </div>
                        <div className="flex-shrink-0 bg-slate-50 pb-safe">
                            <div className="flex px-4 py-3">
                                <button onClick={handleSaveTarget} className="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 flex-1 bg-[#1172d4] text-slate-50 text-base font-bold leading-normal tracking-[0.015em] transform hover:scale-105 hover:bg-[#0d5cb5] active:scale-95 transition-all duration-200">
                                    <span className="truncate">Save Target</span>
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (currentPage === 'about') {
                return (
                    <div className="relative flex h-auto min-h-screen w-full flex-col bg-slate-50 justify-between animate-fade-in" style={{ fontFamily: 'Manrope, "Noto Sans", sans-serif' }}>
                        <div>
                            <div className="flex items-center bg-slate-50 p-4 pb-2 justify-between">
                                <button onClick={() => setCurrentPage('dashboard')} className="text-[#0d141b] flex size-12 shrink-0 items-center cursor-pointer">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
                                        <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path>
                                    </svg>
                                </button>
                                <h2 className="text-[#0d141b] text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">About Us</h2>
                            </div>
                            <p className="text-[#0d141b] text-base font-normal leading-normal pb-3 pt-1 px-4 text-center">Developed by Supun Dilshan</p>
                        </div>
                        <div>
                            <div className="flex gap-2 border-t border-[#e7edf3] bg-slate-50 px-4 pb-3 pt-2">
                                <button onClick={() => setCurrentPage('dashboard')} className="flex flex-1 flex-col items-center justify-end gap-1 rounded-full text-[#0d141b]">
                                    <div className="text-[#0d141b] flex h-8 items-center justify-center">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24px" height="24px" fill="currentColor" viewBox="0 0 256 256">
                                            <path d="M224,115.55V208a16,16,0,0,1-16,16H168a16,16,0,0,1-16-16V168a8,8,0,0,0-8-8H112a8,8,0,0,0-8,8v40a16,16,0,0,1-16,16H48a16,16,0,0,1-16-16V115.55a16,16,0,0,1,5.17-11.78l80-75.48.11-.11a16,16,0,0,1,21.53,0,1.14,1.14,0,0,0,.11.11l80,75.48A16,16,0,0,1,224,115.55Z"></path>
                                        </svg>
                                    </div
