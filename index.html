<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Tracker</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            display: grid;
            place-items: center;
            min-height: 90vh;
            margin: 0;
            color: #333;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background-color: #ffffff;
            padding: 25px 30px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box; /* Important for padding to work right */
            font-size: 16px;
        }
        
        /* Progress Bar */
        .progress-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 30px;
            height: 25px;
            overflow: hidden;
            margin-top: 10px;
            margin-bottom: 25px;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #28a745;
            border-radius: 30px;
            text-align: center;
            line-height: 25px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            transition: width 0.4s ease-in-out;
        }
        
        /* Results Section */
        .results-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        .milestone {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .milestone span {
            font-weight: 500;
            color: #666;
        }
        .milestone strong {
            font-size: 1.1em;
            color: #007bff;
        }
        .milestone strong.achieved {
            color: #28a745;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sales Tracker</h1>

        <div class="input-group">
            <label for="monthlyTarget">Monthly Target (100%)</label>
            <input type="number" id="monthlyTarget" placeholder="e.g., 500000" oninput="calculateSales()">
        </div>

        <div class="input-group">
            <label for="nowSales">Now Sales Value</label>
            <input type="number" id="nowSales" placeholder="e.g., 120000" oninput="calculateSales()">
        </div>

        <h3 id="percentage-label" style="text-align: center; margin-bottom: 10px;">Percentage Achieved</h3>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>
        
        <div class="results-grid">
            <div class="milestone">
                <span>Need for 50%</span>
                <strong id="to50">0</strong>
            </div>
            <div class="milestone">
                <span>Need for 70%</span>
                <strong id="to70">0</strong>
            </div>
            <div class="milestone">
                <span>Need for 100% (Target)</span>
                <strong id="to100">0</strong>
            </div>
        </div>
    </div>

    <script>
        function calculateSales() {
            // 1. Get the values from the input boxes
            const target = parseFloat(document.getElementById('monthlyTarget').value) || 0;
            const current = parseFloat(document.getElementById('nowSales').value) || 0;

            // 2. Get the elements we need to update
            const progressBar = document.getElementById('progressBar');
            const to50El = document.getElementById('to50');
            const to70El = document.getElementById('to70');
            const to100El = document.getElementById('to100');
            
            // Check if target is 0 to avoid errors
            if (target === 0) {
                progressBar.style.width = '0%';
                progressBar.textContent = '0%';
                to50El.textContent = '0';
                to70El.textContent = '0';
                to100El.textContent = '0';
                return;
            }

            // 3. Do the calculations
            let percentage = (current / target) * 100;
            if (percentage > 100) {
                percentage = 100; // Cap at 100%
            }

            const milestone50 = target * 0.5;
            const milestone70 = target * 0.7;

            let remaining50 = milestone50 - current;
            let remaining70 = milestone70 - current;
            let remaining100 = target - current;

            // 4. Update the Percentage Bar
            progressBar.style.width = percentage.toFixed(1) + '%';
            progressBar.textContent = percentage.toFixed(1) + '%';

            // 5. Update the "Need for..." text
            
            // For 50%
            if (remaining50 <= 0) {
                to50El.textContent = 'Achieved!';
                to50El.classList.add('achieved');
            } else {
                to50El.textContent = remaining50.toLocaleString();
                to50El.classList.remove('achieved');
            }

            // For 70%
            if (remaining70 <= 0) {
                to70El.textContent = 'Achieved!';
                to70El.classList.add('achieved');
            } else {
                to70El.textContent = remaining70.toLocaleString();
                to70El.classList.remove('achieved');
            }

            // For 100%
            if (remaining100 <= 0) {
                to100El.textContent = 'Achieved!';
                to100El.classList.add('achieved');
            } else {
                to100El.textContent = remaining100.toLocaleString();
                to100El.classList.remove('achieved');
            }
        }
        
        // Run the calculation once on page load
        calculateSales();
    </script>
    
</body>
</html>
