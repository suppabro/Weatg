<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalesFlow Pro | Smart Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <!-- Library for Image Output -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .light-mode .glass-card {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .tab-active { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3); }
        .gradient-text { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* Report specific styles */
        #report-capture {
            width: 800px;
            padding: 40px;
            background: #0f172a;
            position: absolute;
            left: -9999px; /* Hide from screen but keep in DOM for capture */
        }
    </style>
</head>
<body class="bg-[#0a0a0c] text-white transition-colors duration-500">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.Motion;
        const { AreaChart, Area, ResponsiveContainer, Tooltip } = Recharts;

        const App = () => {
            const [isDark, setIsDark] = useState(true);
            const [activeTab, setActiveTab] = useState('SFP');
            const [showAdmin, setShowAdmin] = useState(false);
            
            const [data, setData] = useState(() => {
                const saved = localStorage.getItem('sales_tracker_v3');
                return saved ? JSON.parse(saved) : {
                    SFP: { target: 100000, actual: 0, unit: 'LKR' },
                    LESIPAY: { target: 50, actual: 0, unit: 'Units' },
                    'ADD TO BILL': { target: 500, actual: 0, unit: 'LKR/Qty' },
                    'ACCESSORY': { target: 200, actual: 0, unit: 'Qty' }
                };
            });

            useEffect(() => {
                localStorage.setItem('sales_tracker_v3', JSON.stringify(data));
            }, [data]);

            const current = data[activeTab];
            const getPercent = (act, tar) => Math.min(Math.round((act / tar) * 100) || 0, 100);
            
            const downloadReport = () => {
                const element = document.getElementById('report-view');
                html2canvas(element, { backgroundColor: isDark ? '#0a0a0c' : '#f8fafc' }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `Sales_Report_${new Date().toLocaleDateString()}.jpg`;
                    link.href = canvas.toDataURL('image/jpeg', 0.9);
                    link.click();
                });
            };

            return (
                <div className={`min-h-screen ${isDark ? 'bg-[#0a0a0c] text-slate-200' : 'bg-gray-50 text-slate-800'} p-4 md:p-10`}>
                    
                    {/* Header */}
                    <div className="max-w-7xl mx-auto flex justify-between items-center mb-10">
                        <motion.h1 initial={{opacity:0}} animate={{opacity:1}} className="text-2xl font-black tracking-tighter">
                            SALES<span className="gradient-text font-extrabold">FLOW</span>
                        </motion.h1>
                        <div className="flex gap-3">
                            <button onClick={downloadReport} className="hidden md:flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 px-5 py-2 rounded-xl font-bold text-sm transition shadow-lg shadow-indigo-500/20">
                                📸 Download JPEG Report
                            </button>
                            <button onClick={() => setIsDark(!isDark)} className="w-10 h-10 rounded-xl glass-card flex items-center justify-center">
                                {isDark ? '🌙' : '☀️'}
                            </button>
                        </div>
                    </div>

                    <div className="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
                        {/* Sidebar */}
                        <div className="lg:col-span-3 space-y-3">
                            {Object.keys(data).map((tab) => (
                                <button 
                                    key={tab}
                                    onClick={() => setActiveTab(tab)}
                                    className={`w-full p-4 rounded-2xl flex items-center justify-between transition-all ${activeTab === tab ? 'tab-active text-white' : 'glass-card hover:bg-white/5 opacity-70'}`}
                                >
                                    <span className="font-bold text-sm">{tab}</span>
                                    <span className="text-[10px] font-black">{getPercent(data[tab].actual, data[tab].target)}%</span>
                                </button>
                            ))}
                            <button onClick={() => setShowAdmin(!showAdmin)} className="w-full p-4 mt-6 rounded-2xl border-2 border-dashed border-indigo-500/30 text-indigo-500 font-bold text-sm">
                                {showAdmin ? 'Close Settings' : '⚙️ Admin Panel'}
                            </button>
                        </div>

                        {/* Dashboard Body */}
                        <div className="lg:col-span-9 space-y-6">
                            <AnimatePresence>
                                {showAdmin && (
                                    <motion.div initial={{height:0, opacity:0}} animate={{height:'auto', opacity:1}} exit={{height:0, opacity:0}} className="glass-card rounded-3xl p-6 overflow-hidden">
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <input type="number" placeholder="Target" value={current.target} onChange={(e) => setData({...data, [activeTab]: {...current, target: Number(e.target.value)}})} className="bg-black/20 p-3 rounded-xl border border-white/10 outline-none" />
                                            <input type="number" placeholder="Actual" value={current.actual} onChange={(e) => setData({...data, [activeTab]: {...current, actual: Number(e.target.value)}})} className="bg-black/20 p-3 rounded-xl border border-white/10 outline-none" />
                                        </div>
                                    </motion.div>
                                )}
                            </AnimatePresence>

                            {/* Detailed View Card */}
                            <motion.div key={activeTab} initial={{y:20, opacity:0}} animate={{y:0, opacity:1}} className="glass-card rounded-[2.5rem] p-8 md:p-12 border-t-4 border-indigo-500">
                                <div className="flex flex-col md:flex-row justify-between items-center gap-8">
                                    <div className="text-center md:text-left">
