<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Target Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root[data-theme="dark"]{
    --bg:#0B1014;
    --bg-grad: radial-gradient(circle at 15% -10%, #14262d 0%, #0B1014 55%);
    --surface:#121A1F;
    --surface-2:#182229;
    --border: rgba(255,255,255,0.08);
    --text:#E7EEEF;
    --text-dim:#8FA3AA;
    --accent:#34D8B8;
    --accent-2:#1FA98D;
    --accent-warm:#F2A93B;
    --track-bg: rgba(255,255,255,0.07);
    --milestone-line: rgba(255,255,255,0.35);
    --danger:#E1685F;
    --shadow: 0 20px 40px -22px rgba(0,0,0,0.65);
  }
  :root[data-theme="light"]{
    --bg:#F3F6F5;
    --bg-grad: radial-gradient(circle at 15% -10%, #E1F1EC 0%, #F3F6F5 55%);
    --surface:#FFFFFF;
    --surface-2:#EEF3F2;
    --border: rgba(10,30,25,0.08);
    --text:#101C1A;
    --text-dim:#5B6B68;
    --accent:#0E9C82;
    --accent-2:#0B7A66;
    --accent-warm:#C97A1A;
    --track-bg: rgba(10,30,25,0.06);
    --milestone-line: rgba(10,30,25,0.28);
    --danger:#C4433D;
    --shadow: 0 20px 40px -22px rgba(20,40,35,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-grad);
    background-color:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    transition:background-color .4s ease, color .4s ease;
  }
  h1,h2,h3,.brand{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}

  .app{max-width:1180px;margin:0 auto;padding:0 20px 60px;}

  /* Topbar */
  .topbar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;gap:18px;
    padding:18px 4px;
    background:linear-gradient(to bottom, var(--bg) 70%, transparent);
    backdrop-filter:blur(6px);
  }
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px;white-space:nowrap;}
  .brand-mark{
    display:inline-flex;align-items:center;justify-content:center;
    width:30px;height:30px;border-radius:9px;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:#04231d;font-size:16px;font-weight:700;
  }
  .tabs{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    border:1px solid transparent;background:transparent;color:var(--text-dim);
    font-family:'Inter',sans-serif;font-weight:600;font-size:14px;
    padding:9px 15px;border-radius:10px;cursor:pointer;white-space:nowrap;
    transition:all .2s ease;
  }
  .tab:hover{color:var(--text);background:var(--surface-2);}
  .tab.active{background:var(--surface);color:var(--text);border-color:var(--border);box-shadow:var(--shadow);}
  .icon-btn{
    border:1px solid var(--border);background:var(--surface);color:var(--text);
    width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:16px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:transform .2s ease, background .2s ease;
  }
  .icon-btn:hover{transform:translateY(-2px);background:var(--surface-2);}

  /* Pages */
  .page{display:none;animation:fadeIn .45s ease;}
  .page.active-page{display:block;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .page-header{margin:6px 0 22px;}
  .page-header h2{
    font-size:26px;margin:0 0 4px;
    background:linear-gradient(90deg, var(--text) 55%, var(--accent) 130%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .page-header p{margin:0;color:var(--text-dim);font-size:14px;}

  .back-link{
    display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);
    text-decoration:none;font-size:13px;font-weight:600;cursor:pointer;margin-bottom:10px;
  }
  .back-link:hover{color:var(--text);}
  .report-row{margin-bottom:20px;}
  .report-row .btn{display:inline-flex;align-items:center;gap:6px;}

  /* Home grid */
  .home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-bottom:30px;}
  .home-card{
    background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:20px;cursor:pointer;box-shadow:var(--shadow);
    transition:transform .25s ease, border-color .25s ease;
    animation:cardIn .5s ease both;
  }
  .home-card:nth-child(1){animation-delay:.04s;}
  .home-card:nth-child(2){animation-delay:.11s;}
  .home-card:nth-child(3){animation-delay:.18s;}
  .home-card:nth-child(4){animation-delay:.25s;}
  @keyframes cardIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .home-card:hover{transform:translateY(-5px);border-color:var(--accent);}
  .home-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .home-card-icon{font-size:22px;}
  .home-card h3{margin:0;font-size:17px;}
  .home-card p{margin:2px 0 14px;color:var(--text-dim);font-size:12.5px;}
  .mini-metric{margin-bottom:12px;}
  .mini-metric:last-child{margin-bottom:0;}
  .mini-metric-top{display:flex;justify-content:space-between;font-size:12px;color:var(--text-dim);margin-bottom:5px;}
  .mini-metric-top b{color:var(--text);font-family:'JetBrains Mono',monospace;font-weight:600;}

  .card-block{
    background:var(--surface);border:1px solid var(--border);border-radius:18px;
    padding:20px;margin-bottom:20px;box-shadow:var(--shadow);
  }
  .card-block h3{margin:0 0 16px;font-size:16px;}

  /* Metric card */
  .metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;}
  .metric-card{
    background:var(--surface);border:1px solid var(--border);border-radius:18px;
    padding:20px;box-shadow:var(--shadow);
    transition:box-shadow .3s ease, border-color .3s ease;
  }
  .metric-card:hover{border-color:var(--accent);box-shadow:var(--shadow), 0 0 0 1px rgba(52,216,184,.15);}
  .metric-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .metric-head h3{margin:0;font-size:16px;}
  .metric-head-right{display:flex;align-items:center;gap:8px;}
  .pct-badge{
    font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;
    background:var(--surface-2);padding:4px 10px;border-radius:8px;color:var(--accent);
  }
  .dots-btn{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);
    width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:15px;line-height:1;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:color .2s ease, border-color .2s ease, transform .2s ease;
  }
  .dots-btn:hover{color:var(--text);border-color:var(--accent);transform:translateY(-1px);}

  /* Settings page */
  .settings-metric{padding:14px 2px;border-top:1px solid var(--border);border-radius:8px;}
  .settings-metric:first-of-type{border-top:none;padding-top:2px;}
  .settings-metric-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
  .settings-metric-label{font-weight:600;font-size:14px;}
  .settings-current{color:var(--text-dim);font-size:12px;}
  .settings-metric.flash{animation:flashBg 1.3s ease;}
  @keyframes flashBg{0%{background:var(--surface-2);}100%{background:transparent;}}
  .settings-note{color:var(--text-dim);font-size:13px;margin:0 0 14px;}
  .metric-numbers{display:flex;gap:22px;margin-bottom:16px;}
  .metric-numbers .num{display:block;font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:600;}
  .metric-numbers .label{display:block;font-size:11.5px;color:var(--text-dim);margin-top:2px;}

  .progress-track{position:relative;height:12px;border-radius:999px;background:var(--track-bg);margin:26px 4px 34px;}
  .progress-fill{
    position:absolute;top:0;left:0;height:100%;border-radius:999px;overflow:hidden;
    background:linear-gradient(90deg,var(--accent-2),var(--accent));
    width:0%;transition:width 1.1s cubic-bezier(.4,0,.2,1);
  }
  .progress-fill::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(120deg, rgba(255,255,255,0) 35%, rgba(255,255,255,.4) 50%, rgba(255,255,255,0) 65%);
    background-size:200% 100%;animation:sheen 2.6s linear infinite;
  }
  @keyframes sheen{0%{background-position:180% 0;}100%{background-position:-80% 0;}}
  .milestone{position:absolute;top:-6px;width:2px;height:24px;background:var(--milestone-line);}
  .milestone-label{position:absolute;top:-24px;font-size:10.5px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;transform:translateX(-50%);white-space:nowrap;}

  .milestone-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px;}
  .milestone-box{
    background:var(--surface-2);border-radius:10px;padding:10px 8px;text-align:center;
    border:1px solid transparent;
  }
  .milestone-box.done{border-color:var(--accent);animation:donePop .45s ease;}
  @keyframes donePop{0%{transform:scale(.92);}55%{transform:scale(1.04);}100%{transform:scale(1);}}
  .mb-label{display:block;font-size:10.5px;color:var(--text-dim);margin-bottom:4px;}
  .mb-value{display:block;font-size:12.5px;font-weight:600;font-family:'JetBrains Mono',monospace;}
  .milestone-box.done .mb-value{color:var(--accent);}
  .pct-badge.badge-complete{background:rgba(52,216,184,.16);}
  .pct-badge.badge-good{background:rgba(242,169,59,.14);color:var(--accent-warm);}

  .input-row{display:flex;gap:8px;margin-bottom:9px;}
  .input-row input{
    flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:10px 12px;border-radius:9px;font-size:13.5px;font-family:'Inter',sans-serif;
    min-width:0;
  }
  .input-row input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .btn{
    border:none;border-radius:9px;padding:10px 14px;font-size:13px;font-weight:600;
    cursor:pointer;white-space:nowrap;font-family:'Inter',sans-serif;
    transition:transform .15s ease, filter .15s ease;
  }
  .btn:hover{filter:brightness(1.08);transform:translateY(-1px);}
  .btn-primary{background:var(--text);color:var(--bg);}
  .btn-accent{background:var(--accent);color:#04231d;}
  .btn-ghost{background:var(--surface-2);color:var(--text-dim);border:1px solid var(--border);flex:1;}
  .btn-ghost.danger{color:var(--danger);}
  .reset-row{margin-top:12px;}

  .chart-wrap{height:110px;margin-top:6px;}

  .toast-wrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;}
  .toast{
    background:var(--surface);border:1px solid var(--accent);color:var(--text);
    padding:10px 18px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow);
    animation:toastIn .25s ease;
  }
  @keyframes toastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  footer{text-align:center;color:var(--text-dim);font-size:12px;padding:30px 0 10px;}

  /* PIN modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(4,8,10,.6);backdrop-filter:blur(4px);
    z-index:100;display:none;align-items:center;justify-content:center;padding:20px;
  }
  .modal-overlay.show{display:flex;animation:overlayIn .2s ease;}
  @keyframes overlayIn{from{opacity:0;}to{opacity:1;}}
  .modal-box{
    background:var(--surface);border:1px solid var(--border);border-radius:18px;
    padding:26px;max-width:320px;width:100%;box-shadow:var(--shadow);
    animation:modalPop .3s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes modalPop{from{transform:scale(.9);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal-box.shake{animation:shake .4s ease;}
  @keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-6px);}80%{transform:translateX(6px);}}
  .modal-box h3{margin:0 0 6px;font-size:18px;}
  .modal-box p{margin:0 0 16px;color:var(--text-dim);font-size:13px;}
  .modal-box input{
    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    padding:11px 13px;border-radius:9px;font-size:14px;margin-bottom:6px;letter-spacing:1px;
  }
  .modal-box input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .pin-error{color:var(--danger);font-size:12.5px;margin:6px 0 14px;display:none;}
  .pin-error.show{display:block;}
  .modal-actions{display:flex;gap:8px;margin-top:6px;}
  .modal-actions .btn{flex:1;}

  @media (max-width:640px){
    .app{padding:0 12px 40px;}
    .brand span.brand-text{display:none;}
    .metric-numbers{gap:14px;}
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-mark">◉</span><span class="brand-text">Target Tracker</span></div>
    <nav class="tabs" id="tabs">
      <button class="tab" data-page="home">Home</button>
      <button class="tab" data-page="sfp">SFP</button>
      <button class="tab" data-page="lesipay">Lesipay</button>
      <button class="tab" data-page="addtobill">Add To Bill</button>
      <button class="tab" data-page="accessory">Accessory</button>
    </nav>
    <button class="icon-btn" id="settingsBtn" title="Settings (set targets)">⋮</button>
    <button class="icon-btn" id="themeToggle" title="Switch theme">🌙</button>
  </header>

  <main id="main">
    <section class="page" id="page-home">
      <div class="page-header">
        <h2>This Month's Targets</h2>
        <p>Select a channel to view progress and add sales.</p>
      </div>
      <div class="home-grid" id="homeGrid"></div>
    </section>

    <section class="page" id="page-sfp"><div class="panel-content"></div></section>
    <section class="page" id="page-lesipay"><div class="panel-content"></div></section>
    <section class="page" id="page-addtobill"><div class="panel-content"></div></section>
    <section class="page" id="page-accessory"><div class="panel-content"></div></section>
    <section class="page" id="page-settings"><div class="panel-content"></div></section>
  </main>

  <footer>Data is saved on this device only.</footer>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<div class="modal-overlay" id="pinOverlay">
  <div class="modal-box" id="pinBox">
    <h3>🔒 Settings Access</h3>
    <p>Enter the PIN to set targets or reset progress.</p>
    <input type="password" id="pinInput" placeholder="PIN" autocomplete="off">
    <p class="pin-error" id="pinError">Incorrect PIN. Try again.</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="pinCancel">Cancel</button>
      <button class="btn btn-primary" id="pinSubmit">Unlock</button>
    </div>
  </div>
</div>

<script>
/* ---------- Config ---------- */
const STORAGE_KEY = 'targetTrackerV1';
const THEME_KEY = 'targetTrackerTheme';

const CHANNELS = [
  { key:'sfp',        name:'SFP',          icon:'📶', desc:'Target is based on sales value',            metrics:['price'] },
  { key:'lesipay',     name:'Lesipay',      icon:'💳', desc:'Target is based on quantity sold',          metrics:['qty'] },
  { key:'addtobill',   name:'Add To Bill',  icon:'🧾', desc:'Target is based on quantity and value',     metrics:['qty','price'] },
  { key:'accessory',   name:'Accessory',    icon:'🎧', desc:'Target is based on quantity and value',     metrics:['qty','price'] }
];

const METRIC_LABEL = { qty:'Quantity', price:'Sales Value' };
const METRIC_UNIT_SHORT = { qty:'units', price:'Rs.' };

/* ---------- Data ---------- */
function defaultData(){
  const d = {};
  CHANNELS.forEach(c=>{
    d[c.key] = {};
    c.metrics.forEach(m=> d[c.key][m] = { target:0, sold:0 });
  });
  return d;
}
function loadData(){
  try{
    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(!raw) return defaultData();
    const d = defaultData();
    CHANNELS.forEach(c=> c.metrics.forEach(m=>{
      if(raw[c.key] && raw[c.key][m]){
        d[c.key][m].target = Number(raw[c.key][m].target) || 0;
        d[c.key][m].sold = Number(raw[c.key][m].sold) || 0;
      }
    }));
    return d;
  }catch(e){ return defaultData(); }
}
let data = loadData();
function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

/* ---------- Helpers ---------- */
function fmt(val, metric){
  const n = Number(val)||0;
  if(metric==='price') return 'Rs. ' + n.toLocaleString('en-US',{maximumFractionDigits:0});
  return n.toLocaleString('en-US') + ' units';
}
function pct(sold, target){ if(!target || target<=0) return 0; return (sold/target)*100; }
function need(target, sold, fraction){
  const v = (target*fraction) - sold;
  return v>0 ? v : 0;
}
function getVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function animateCount(el){
  const target = parseFloat(el.dataset.value) || 0;
  const metric = el.dataset.metric;
  const duration = 700;
  const start = performance.now();
  function step(now){
    const t = Math.min((now-start)/duration, 1);
    const eased = 1 - Math.pow(1-t, 3);
    el.textContent = fmt(target*eased, metric);
    if(t<1) requestAnimationFrame(step);
    else el.textContent = fmt(target, metric);
  }
  requestAnimationFrame(step);
}
function showToast(msg){
  const el = document.createElement('div');
  el.className='toast';
  el.textContent=msg;
  document.getElementById('toastWrap').appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s ease'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 1800);
}

/* ---------- Chart instances ---------- */
const chartInstances = {};
function destroyChart(id){ if(chartInstances[id]){ chartInstances[id].destroy(); delete chartInstances[id]; } }

function makeMetricChart(canvasId, target, sold, metric){
  destroyChart(canvasId);
  const ctx = document.getElementById(canvasId);
  if(!ctx) return;
  const accent = getVar('--accent'), track = getVar('--track-bg'), dim = getVar('--text-dim'), textColor = getVar('--text');
  chartInstances[canvasId] = new Chart(ctx, {
    type:'bar',
    data:{
      labels:['Achieved','Target'],
      datasets:[{ data:[sold, target], backgroundColor:[accent, track], borderRadius:8, barThickness:22 }]
    },
    options:{
      indexAxis:'y',
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{ callbacks:{ label:(c)=> metric==='price' ? ('Rs. '+c.raw.toLocaleString('en-US')) : (c.raw.toLocaleString('en-US')+' units') } }
      },
      scales:{
        x:{ grid:{color:track}, ticks:{color:dim, font:{size:11}} },
        y:{ grid:{display:false}, ticks:{color:textColor, font:{size:12, weight:'600'}} }
      }
    }
  });
}

/* ---------- Rendering ---------- */
function metricCardHTML(chKey, metric){
  const d = data[chKey][metric];
  const p = pct(d.sold, d.target);
  const pClamped = Math.min(p, 100);
  const need50 = need(d.target, d.sold, 0.5);
  const need70 = need(d.target, d.sold, 0.7);
  const need100 = need(d.target, d.sold, 1.0);
  const hasTarget = d.target > 0;
  const badgeClass = !hasTarget ? '' : (p>=100 ? 'badge-complete' : (p>=70 ? 'badge-good' : ''));
  return `
  <div class="metric-card">
    <div class="metric-head">
      <h3>${METRIC_LABEL[metric]}</h3>
      <div class="metric-head-right">
        <span class="pct-badge ${badgeClass}">${hasTarget ? p.toFixed(1)+'%' : '—'}</span>
        <button class="dots-btn" data-action="openSettings" data-channel="${chKey}" data-metric="${metric}" title="Target settings">⋮</button>
      </div>
    </div>
    <div class="metric-numbers">
      <div><span class="num" data-count="true" data-value="${d.sold}" data-metric="${metric}">${fmt(0, metric)}</span><span class="label">Achieved</span></div>
      <div><span class="num">${fmt(d.target, metric)}</span><span class="label">Target</span></div>
    </div>

    <div class="progress-track">
      <div class="progress-fill" style="width:${hasTarget ? pClamped : 0}%"></div>
      <div class="milestone" style="left:50%"></div>
      <div class="milestone-label" style="left:50%">50%</div>
      <div class="milestone" style="left:70%"></div>
      <div class="milestone-label" style="left:70%">70%</div>
      <div class="milestone" style="left:calc(100% - 2px)"></div>
      <div class="milestone-label" style="left:100%;transform:translateX(-100%)">100%</div>
    </div>

    <div class="milestone-grid">
      <div class="milestone-box ${need50<=0 && hasTarget?'done':''}"><span class="mb-label">To 50%</span><span class="mb-value">${!hasTarget?'—':(need50<=0?'Done':fmt(need50,metric))}</span></div>
      <div class="milestone-box ${need70<=0 && hasTarget?'done':''}"><span class="mb-label">To 70%</span><span class="mb-value">${!hasTarget?'—':(need70<=0?'Done':fmt(need70,metric))}</span></div>
      <div class="milestone-box ${need100<=0 && hasTarget?'done':''}"><span class="mb-label">To 100%</span><span class="mb-value">${!hasTarget?'—':(need100<=0?'Done':fmt(need100,metric))}</span></div>
    </div>

    <div class="metric-actions">
      <div class="input-row">
        <input type="number" min="0" step="any" placeholder="Add a sale (${METRIC_UNIT_SHORT[metric]})" id="${chKey}-${metric}-saleInput">
        <button class="btn btn-accent" data-action="addSale" data-channel="${chKey}" data-metric="${metric}">Add Sale</button>
      </div>
    </div>

    <div class="chart-wrap"><canvas id="chart-${chKey}-${metric}"></canvas></div>
  </div>`;
}

function renderChannel(chKey){
  const ch = CHANNELS.find(c=>c.key===chKey);
  const container = document.querySelector(`#page-${chKey} .panel-content`);
  container.innerHTML = `
    <a class="back-link" data-action="goHome">← Back to Home</a>
    <div class="page-header">
      <h2>${ch.icon} ${ch.name}</h2>
      <p>${ch.desc}</p>
    </div>
    <div class="report-row">
      <button class="btn btn-primary" data-action="getReport" data-channel="${chKey}">📸 Get Report</button>
    </div>
    <div class="metric-grid">
      ${ch.metrics.map(m=>metricCardHTML(chKey,m)).join('')}
    </div>
  `;
  ch.metrics.forEach(m=>{
    const d = data[chKey][m];
    makeMetricChart(`chart-${chKey}-${m}`, d.target, d.sold, m);
  });
  container.querySelectorAll('.num[data-count]').forEach(animateCount);
}

function settingsMetricHTML(chKey, metric){
  const d = data[chKey][metric];
  return `
  <div class="settings-metric" id="settings-${chKey}-${metric}">
    <div class="settings-metric-top">
      <span class="settings-metric-label">${METRIC_LABEL[metric]}</span>
      <span class="mono settings-current">${fmt(d.sold,metric)} / ${fmt(d.target,metric)}</span>
    </div>
    <div class="input-row">
      <input type="number" min="0" step="any" placeholder="Monthly target (${METRIC_UNIT_SHORT[metric]})" id="${chKey}-${metric}-targetInput" value="${d.target||''}">
      <button class="btn btn-primary" data-action="setTarget" data-channel="${chKey}" data-metric="${metric}">Save Target</button>
    </div>
    <div class="input-row">
      <button class="btn btn-ghost" data-action="resetProgress" data-channel="${chKey}" data-metric="${metric}">Reset Progress</button>
      <button class="btn btn-ghost danger" data-action="resetAll" data-channel="${chKey}" data-metric="${metric}">Reset Target &amp; Progress</button>
    </div>
  </div>`;
}

function settingsSectionHTML(ch){
  return `
  <div class="card-block" id="settings-${ch.key}">
    <h3>${ch.icon} ${ch.name}</h3>
    ${ch.metrics.map(m=>settingsMetricHTML(ch.key,m)).join('')}
  </div>`;
}

function renderSettings(){
  const container = document.querySelector('#page-settings .panel-content');
  container.innerHTML = `
    <a class="back-link" data-action="goHome">← Back to Home</a>
    <div class="page-header">
      <h2>Settings</h2>
      <p>Set monthly targets and manage resets here. The channel pages only show progress and let anyone add a sale.</p>
    </div>
    <button class="btn btn-ghost" id="lockBtn" style="margin-bottom:20px;">🔒 Lock Settings</button>
    <div class="card-block">
      <h3>New Month</h3>
      <p class="settings-note">Resets progress (sold amounts) for all channels but keeps the existing targets.</p>
      <button class="btn btn-primary" id="newMonthBtn">Start New Month</button>
    </div>
    ${CHANNELS.map(settingsSectionHTML).join('')}
  `;
  document.getElementById('newMonthBtn').addEventListener('click', handleNewMonth);
  document.getElementById('lockBtn').addEventListener('click', ()=>{
    sessionStorage.removeItem('settingsUnlocked');
    showPage('home');
    showToast('Settings locked');
  });
}

function homeCardHTML(ch){
  const metricsHTML = ch.metrics.map(m=>{
    const d = data[ch.key][m];
    const p = d.target>0 ? pct(d.sold,d.target) : 0;
    return `
    <div class="mini-metric">
      <div class="mini-metric-top"><span>${METRIC_LABEL[m]}</span><b>${d.target>0? p.toFixed(1)+'%':'No target set'}</b></div>
      <div class="progress-track" style="margin:8px 4px 4px;height:9px;">
        <div class="progress-fill" style="width:${Math.min(p,100)}%"></div>
      </div>
    </div>`;
  }).join('');
  return `
  <div class="home-card" data-action="openChannel" data-channel="${ch.key}">
    <div class="home-card-top">
      <span class="home-card-icon">${ch.icon}</span>
    </div>
    <h3>${ch.name}</h3>
    <p>${ch.desc}</p>
    ${metricsHTML}
  </div>`;
}

function renderHome(){
  document.getElementById('homeGrid').innerHTML = CHANNELS.map(homeCardHTML).join('');
}

/* ---------- Navigation ---------- */
let currentPage = 'home';
function showPage(key){
  currentPage = key;
  document.querySelectorAll('.tab').forEach(b=> b.classList.toggle('active', b.dataset.page===key));
  document.querySelectorAll('.page').forEach(p=> p.classList.toggle('active-page', p.id === 'page-'+key));
  if(key==='home') renderHome();
  else if(key==='settings') renderSettings();
  else renderChannel(key);
}

document.getElementById('tabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('.tab');
  if(!btn) return;
  showPage(btn.dataset.page);
});

document.getElementById('settingsBtn').addEventListener('click', ()=> requestSettingsAccess());

/* ---------- PIN protection for Settings ---------- */
const SETTINGS_PIN = 'supun';
let pendingSettingsTarget = null;

function requestSettingsAccess(target){
  if(sessionStorage.getItem('settingsUnlocked') === 'true'){
    goToSettings(target);
    return;
  }
  pendingSettingsTarget = target || null;
  openPinModal();
}

function goToSettings(target){
  showPage('settings');
  if(target && target.channel && target.metric){
    setTimeout(()=>{
      const el = document.getElementById(`settings-${target.channel}-${target.metric}`);
      if(el){
        el.scrollIntoView({behavior:'smooth', block:'center'});
        el.classList.add('flash');
        setTimeout(()=> el.classList.remove('flash'), 1300);
      }
    }, 80);
  }
}

function openPinModal(){
  document.getElementById('pinOverlay').classList.add('show');
  document.getElementById('pinInput').value = '';
  document.getElementById('pinError').classList.remove('show');
  setTimeout(()=> document.getElementById('pinInput').focus(), 60);
}
function closePinModal(){
  document.getElementById('pinOverlay').classList.remove('show');
  pendingSettingsTarget = null;
}
function submitPin(){
  const val = document.getElementById('pinInput').value.trim();
  if(val.toLowerCase() === SETTINGS_PIN.toLowerCase()){
    sessionStorage.setItem('settingsUnlocked', 'true');
    const target = pendingSettingsTarget;
    closePinModal();
    goToSettings(target);
  } else {
    const box = document.getElementById('pinBox');
    document.getElementById('pinError').classList.add('show');
    box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
  }
}
document.getElementById('pinSubmit').addEventListener('click', submitPin);
document.getElementById('pinInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') submitPin(); });
document.getElementById('pinCancel').addEventListener('click', closePinModal);
document.getElementById('pinOverlay').addEventListener('click', (e)=>{ if(e.target.id==='pinOverlay') closePinModal(); });

/* ---------- Actions (event delegation) ---------- */
document.getElementById('main').addEventListener('click', (e)=>{
  const goHome = e.target.closest('[data-action="goHome"]');
  if(goHome){ showPage('home'); return; }

  const openCard = e.target.closest('[data-action="openChannel"]');
  if(openCard){ showPage(openCard.dataset.channel); return; }

  const btn = e.target.closest('button[data-action]');
  if(!btn) return;
  const action = btn.dataset.action;
  const ch = btn.dataset.channel;
  const metric = btn.dataset.metric;

  if(action==='openSettings'){
    requestSettingsAccess({channel:ch, metric:metric});
    return;
  }

  if(action==='getReport'){
    generateReport(ch);
    return;
  }

  if(action==='setTarget'){
    const input = document.getElementById(`${ch}-${metric}-targetInput`);
    const val = parseFloat(input.value);
    if(isNaN(val) || val < 0){ showToast('Enter a valid target amount'); return; }
    data[ch][metric].target = val;
    saveData();
    renderSettings();
    showToast(`${METRIC_LABEL[metric]} target saved for ${CHANNELS.find(c=>c.key===ch).name}`);
  }

  if(action==='addSale'){
    const input = document.getElementById(`${ch}-${metric}-saleInput`);
    const val = parseFloat(input.value);
    if(isNaN(val) || val <= 0){ showToast('Enter a valid sale amount'); return; }
    data[ch][metric].sold += val;
    saveData();
    renderChannel(ch);
    showToast('Sale added');
  }

  if(action==='resetProgress'){
    if(!confirm('Reset progress for this metric back to 0? The target will stay the same.')) return;
    data[ch][metric].sold = 0;
    saveData();
    renderSettings();
    showToast('Progress reset');
  }

  if(action==='resetAll'){
    if(!confirm('Reset both target and progress for this metric?')) return;
    data[ch][metric] = { target:0, sold:0 };
    saveData();
    renderSettings();
    showToast('Target and progress cleared');
  }
});

function handleNewMonth(){
  if(!confirm('Start a new month? This resets progress (sold amounts) for all channels but keeps existing targets.')) return;
  CHANNELS.forEach(c=> c.metrics.forEach(m=> data[c.key][m].sold = 0));
  saveData();
  renderSettings();
  showToast('New month started — progress reset');
}

/* ---------- Get Report (save/share as image) ---------- */
async function generateReport(chKey){
  const ch = CHANNELS.find(c=>c.key===chKey);
  const panel = document.querySelector(`#page-${chKey} .panel-content`);
  if(!panel || typeof html2canvas === 'undefined'){ showToast('Report tool did not load — check your connection'); return; }

  const hidden = [];
  function hide(el, prop, val){
    if(!el) return;
    hidden.push({el, prop, val: el.style[prop]});
    el.style[prop] = val;
  }
  panel.querySelectorAll('.back-link, .report-row, .metric-actions').forEach(el=> hide(el,'display','none'));
  panel.querySelectorAll('.dots-btn').forEach(el=> hide(el,'visibility','hidden'));

  showToast('Creating image…');
  await new Promise(r=> setTimeout(r, 80));

  let canvas;
  try{
    canvas = await html2canvas(panel, {
      backgroundColor: getVar('--bg') || '#0B1014',
      scale: 2,
      useCORS: true
    });
  }catch(err){
    hidden.forEach(h=> h.el.style[h.prop] = h.val);
    showToast('Could not create report image');
    return;
  }
  hidden.forEach(h=> h.el.style[h.prop] = h.val);

  canvas.toBlob(async (blob)=>{
    if(!blob){ showToast('Could not create report image'); return; }
    const fileName = `${chKey}-target-report.png`;
    try{
      if(navigator.canShare){
        const file = new File([blob], fileName, {type:'image/png'});
        if(navigator.canShare({files:[file]})){
          await navigator.share({ files:[file], title:`${ch.name} Target Report` });
          return;
        }
      }
    }catch(e){ return; } /* share sheet cancelled */
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = fileName;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Report image saved');
  }, 'image/png');
}

/* ---------- Theme ---------- */
function applyTheme(theme){
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeToggle').textContent = theme==='dark' ? '🌙' : '☀️';
  localStorage.setItem(THEME_KEY, theme);
}
document.getElementById('themeToggle').addEventListener('click', ()=>{
  const next = document.documentElement.getAttribute('data-theme')==='dark' ? 'light' : 'dark';
  applyTheme(next);
  showPage(currentPage);
});

/* ---------- Init ---------- */
applyTheme(localStorage.getItem(THEME_KEY) || 'dark');
showPage('home');
</script>
